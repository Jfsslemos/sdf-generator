name: notebook-syntax

on:
  push:
    branches: [dissertacao-2026]
    paths:
      - 'notebooks/**.ipynb'
      - 'tools/dmnerf/build_notebooks.py'
  pull_request:
    paths:
      - 'notebooks/**.ipynb'
      - 'tools/dmnerf/build_notebooks.py'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compile every Python notebook cell
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          failed = []
          for path in sorted(Path("notebooks").glob("*.ipynb")):
              nb = json.loads(path.read_text())
              for i, cell in enumerate(nb.get("cells", [])):
                  if cell.get("cell_type") != "code":
                      continue
                  source = "".join(cell.get("source", []))
                  try:
                      compile(source, f"{path}:cell-{i}", "exec")
                  except SyntaxError as exc:
                      failed.append(f"{path}: cell {i}: {exc}")
          if failed:
              raise SystemExit("\n".join(failed))
          print("All dissertation notebook code cells compile.")
          PY

      - name: Lightweight baseline and postprocess tests
        run: |
          python -m pip install --quiet numpy pillow trimesh
          python -m unittest tests.test_baseline_postprocess -v
