name: One-shot compact visual QA

on:
  push:
    branches:
      - work-codex-2026
    paths:
      - ".github/workflows/latex-one-shot.yml"

permissions:
  contents: write

jobs:
  compact-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Render compact contact sheets
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils imagemagick
          pdf=docs/exports/Dissertacao_Orientador_2026-10-20_Revisao_Pontual.pdf
          out=docs/exports/qa_visual_2026-10-20
          rm -f "$out"/pages_*.png "$out"/pages_*.jpg
          mkdir -p /tmp/pages "$out"
          pdftoppm -jpeg -jpegopt quality=85 -r 55 "$pdf" /tmp/pages/page
          for first in $(seq 1 4 44); do
            files=()
            for n in $(seq "$first" $((first + 3))); do
              printf -v f '/tmp/pages/page-%02d.jpg' "$n"
              if [ -f "$f" ]; then files+=("$f"); fi
            done
            idx=$(( (first - 1) / 4 + 1 ))
            printf -v target 'docs/exports/qa_visual_2026-10-20/pages_%02d.jpg' "$idx"
            montage "${files[@]}" -tile 2x2 -geometry +8+8 -background white -quality 88 "$target"
          done
          test "$(find "$out" -name 'pages_*.jpg' | wc -l)" -eq 11

      - name: Publish compact sheets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Jfsslemos'
          git config user.email '52664824+Jfsslemos@users.noreply.github.com'
          git add -A docs/exports/qa_visual_2026-10-20
          git rm .github/workflows/latex-one-shot.yml
          git commit -m 'qa: prepare compact dissertation page sheets'
          git push
