name: One-shot dissertation build

on:
  push:
    branches:
      - work-codex-2026
    paths:
      - ".github/workflows/latex-one-shot.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install LaTeX and QA tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make zip poppler-utils imagemagick ghostscript \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-lang-portuguese texlive-publishers \
            texlive-bibtex-extra

      - name: Compile dissertation
        working-directory: docs/dissertation/final_advisor_2026-10-13
        run: make clean && make

      - name: Validate PDF and text
        shell: bash
        run: |
          set -euo pipefail
          src=docs/dissertation/final_advisor_2026-10-13
          pdf="$src/main.pdf"
          extracted=/tmp/dissertation.txt
          pdfinfo "$pdf" | tee /tmp/pdfinfo.txt
          grep -q '^Pages: *44$' /tmp/pdfinfo.txt
          grep -q '^Page size: *595.276 x 841.89 pts (A4)$' /tmp/pdfinfo.txt
          pdftotext -layout "$pdf" "$extracted"
          ! grep -Eiq 'implementação e na avaliação|e não um novo método|evidenciando|comparação quantitativa' "$extracted"
          ! grep -Eiq 'tol-$' "$extracted"
          ! grep -Eiq 'undefined|Citation.*undefined|Reference.*undefined|There were undefined' "$src/main.log"
          for value in '41,1100' '0,9875' '0,0260' '0,9956' '0,7192' '0,0480' '0,1960' '0,7750' '0,0285' '0,1288' '0,3721' '95,844' '29.545'; do
            grep -q "$value" "$extracted"
          done
          mkdir -p /tmp/dissertation-pages
          pdftoppm -png -r 110 "$pdf" /tmp/dissertation-pages/page
          test "$(find /tmp/dissertation-pages -name 'page-*.png' | wc -l)" -eq 44
          pdfimages -list "$pdf" | tee /tmp/pdfimages.txt

      - name: Package PDF and LaTeX source
        shell: bash
        run: |
          set -euo pipefail
          src=docs/dissertation/final_advisor_2026-10-13
          out=docs/exports
          pdf_out="$out/Dissertacao_Orientador_2026-10-20_Revisao_Pontual.pdf"
          cp "$src/main.pdf" "$pdf_out"
          cd docs/dissertation
          zip -X -r "../../exports/Dissertacao_Orientador_2026-10-20_Fonte_LaTeX.zip" final_advisor_2026-10-13 \
            -x 'final_advisor_2026-10-13/main.aux' \
               'final_advisor_2026-10-13/main.bbl' \
               'final_advisor_2026-10-13/main.blg' \
               'final_advisor_2026-10-13/main.lof' \
               'final_advisor_2026-10-13/main.log' \
               'final_advisor_2026-10-13/main.lot' \
               'final_advisor_2026-10-13/main.out' \
               'final_advisor_2026-10-13/main.pdf' \
               'final_advisor_2026-10-13/main.toc'
          unzip -t "../../exports/Dissertacao_Orientador_2026-10-20_Fonte_LaTeX.zip"

      - name: Publish generated files and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Jfsslemos'
          git config user.email '52664824+Jfsslemos@users.noreply.github.com'
          git add docs/exports/Dissertacao_Orientador_2026-10-20_Revisao_Pontual.pdf
          git add docs/exports/Dissertacao_Orientador_2026-10-20_Fonte_LaTeX.zip
          git rm .github/workflows/latex-one-shot.yml
          git commit -m 'docs: publish punctual dissertation revision'
          git push
