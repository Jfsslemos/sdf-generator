name: One-shot visual QA

on:
  push:
    branches:
      - work-codex-2026
    paths:
      - ".github/workflows/visual-qa-one-shot.yml"

permissions:
  contents: write

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make poppler-utils imagemagick ghostscript \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-lang-portuguese texlive-publishers \
            texlive-bibtex-extra

      - name: Compile and render every page
        shell: bash
        run: |
          set -euo pipefail
          src=docs/dissertation/final_advisor_2026-10-13
          (cd "$src" && make clean && make)
          pdf="$src/main.pdf"
          mkdir -p /tmp/pages docs/exports/qa_visual_2026-10-20
          pdftoppm -png -r 85 "$pdf" /tmp/pages/page
          for first in $(seq 1 4 44); do
            files=()
            for n in $(seq "$first" $((first + 3))); do
              printf -v f '/tmp/pages/page-%02d.png' "$n"
              if [ -f "$f" ]; then files+=("$f"); fi
            done
            idx=$(( (first - 1) / 4 + 1 ))
            printf -v out 'docs/exports/qa_visual_2026-10-20/pages_%02d.png' "$idx"
            montage "${files[@]}" -tile 2x2 -geometry +12+12 -background white "$out"
          done
          sha256sum "$pdf" > docs/exports/qa_visual_2026-10-20/pdf_sha256.txt
          mkdir -p /tmp/pdfimages
          pdfimages -png "$pdf" /tmp/pdfimages/image
          find /tmp/pdfimages -type f -name '*.png' -exec sha256sum {} + | sort > docs/exports/qa_visual_2026-10-20/image_hashes.txt
          cut -d' ' -f1 docs/exports/qa_visual_2026-10-20/image_hashes.txt | uniq -d > docs/exports/qa_visual_2026-10-20/duplicate_hashes.txt
          test ! -s docs/exports/qa_visual_2026-10-20/duplicate_hashes.txt

      - name: Publish temporary QA sheets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Jfsslemos'
          git config user.email '52664824+Jfsslemos@users.noreply.github.com'
          git add docs/exports/qa_visual_2026-10-20
          git rm .github/workflows/visual-qa-one-shot.yml
          git commit -m 'qa: render dissertation pages for final inspection'
          git push
