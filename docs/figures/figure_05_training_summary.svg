<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title{font:700 34px 'DejaVu Sans',sans-serif;fill:#17324d}.subtitle{font:400 18px 'DejaVu Sans',sans-serif;fill:#536779}
      .value{font:700 40px 'DejaVu Sans',sans-serif;fill:#17324d}.valueWide{font:700 31px 'DejaVu Sans',sans-serif;fill:#17324d}.label{font:400 17px 'DejaVu Sans',sans-serif;fill:#536779}
      .h{font:700 21px 'DejaVu Sans',sans-serif;fill:#17324d}.t{font:400 17px 'DejaVu Sans',sans-serif;fill:#29445b}.small{font:400 15px 'DejaVu Sans',sans-serif;fill:#536779}
      .card{fill:#fff;stroke:#9bb0c1;stroke-width:2.5}.session{fill:#e8f1fb;stroke:#4478a6;stroke-width:2.5}.line{stroke:#50697d;stroke-width:5}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="80" y="70" class="title">Resumo descritivo do treinamento científico</text>
  <text x="80" y="105" class="subtitle">Execução concluída; avaliação final e extração da malha permanecem fora deste resumo.</text>

  <text x="100" y="185" class="h">Continuidade do mesmo treinamento</text>
  <line x1="190" y1="270" x2="1410" y2="270" class="line"/>
  <circle cx="300" cy="270" r="22" fill="#4478a6"/><circle cx="800" cy="270" r="22" fill="#4478a6"/><circle cx="1300" cy="270" r="22" fill="#4478a6"/>
  <rect x="165" y="315" width="270" height="100" rx="15" class="session"/><text x="300" y="357" text-anchor="middle" class="h">Sessão 1</text><text x="300" y="389" text-anchor="middle" class="t">checkpoint preservado</text>
  <rect x="665" y="315" width="270" height="100" rx="15" class="session"/><text x="800" y="357" text-anchor="middle" class="h">Sessão 2</text><text x="800" y="389" text-anchor="middle" class="t">retomada do estado</text>
  <rect x="1165" y="315" width="270" height="100" rx="15" class="session"/><text x="1300" y="357" text-anchor="middle" class="h">Sessão 3</text><text x="1300" y="389" text-anchor="middle" class="t">200.000 iterações</text>

  <rect x="95" y="515" width="270" height="175" rx="18" class="card"/>
  <text x="230" y="580" text-anchor="middle" class="value">200.000</text><text x="230" y="620" text-anchor="middle" class="label">iterações finais</text><text x="230" y="660" text-anchor="middle" class="small">meta de treinamento atingida</text>
  <rect x="385" y="515" width="270" height="175" rx="18" class="card"/>
  <text x="520" y="580" text-anchor="middle" class="value">199.916</text><text x="520" y="620" text-anchor="middle" class="label">atualizações efetivas</text><text x="520" y="660" text-anchor="middle" class="small">aplicadas pelo otimizador</text>
  <rect x="675" y="515" width="270" height="175" rx="18" class="card"/>
  <text x="810" y="580" text-anchor="middle" class="value">85</text><text x="810" y="620" text-anchor="middle" class="label">atualizações puladas</text><text x="810" y="660" text-anchor="middle" class="small">GradScaler / AMP</text>
  <rect x="965" y="515" width="270" height="175" rx="18" class="card"/>
  <text x="1100" y="580" text-anchor="middle" class="valueWide">≈ 30 h 58 min</text><text x="1100" y="620" text-anchor="middle" class="label">tempo acumulado</text><text x="1100" y="660" text-anchor="middle" class="small">três sessões de treino</text>
  <rect x="1255" y="515" width="270" height="175" rx="18" class="card"/>
  <text x="1390" y="580" text-anchor="middle" class="valueWide">≈ 5,58 GiB</text><text x="1390" y="620" text-anchor="middle" class="label">pico PyTorch</text><text x="1390" y="660" text-anchor="middle" class="small">memória alocada</text>

  <rect x="210" y="760" width="1180" height="75" rx="15" fill="#fff7e8" stroke="#d08a2d" stroke-width="2.5"/>
  <text x="800" y="807" text-anchor="middle" class="t">Estes dados descrevem custo e execução; não substituem métricas do conjunto de teste.</text>
</svg>
